<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Système Embarqué — Anatomie interactive</title>
<style>
:root{--bg:#050a14;--bg2:#0a1428;--tx:#d8e6f5;--cy:#22d3ee;--bl:#3b82f6;--gr:#34d399;--or:#fb923c;--mu:#7f93ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#050a14}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,#0e2040 0,var(--bg) 70%);color:var(--tx);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #15294a;flex-wrap:wrap}
h1{font-size:13px;letter-spacing:.2em;margin:0;color:var(--cy)}
#bc{flex:1;font-size:13px;color:var(--mu);min-width:140px}#bc a{color:var(--cy);cursor:pointer}#bc b{color:var(--tx)}
button{background:#0d1d38;color:var(--tx);border:1px solid #1e3a66;border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit}
button:hover,button.on{border-color:var(--cy);box-shadow:0 0 10px #22d3ee55}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;overflow:auto;display:flex;align-items:center;justify-content:center}
#view{width:100%;max-width:980px;padding:10px;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s;transform-origin:center}
#view.out{opacity:0;transform:scale(1.5)}
#panel{width:340px;border-left:1px solid #15294a;background:#07101f;padding:14px;overflow:auto}
#panel h2{margin:0 0 6px;font-size:18px;color:var(--cy)}#panel .tn{direction:rtl;text-align:right;background:#0b1a33;border-right:3px solid var(--gr);padding:8px;border-radius:6px;margin-top:8px}
.tag{font-size:10px;color:var(--mu);letter-spacing:.1em;text-transform:uppercase;margin-top:10px}
.hs{cursor:pointer;transition:filter .2s}.hs:hover{filter:drop-shadow(0 0 8px var(--cy))}.hs.sel{filter:drop-shadow(0 0 10px var(--gr))}.hs:hover .lbl{opacity:1}.lbl{opacity:.0;transition:.2s}
.hs text,svg text{font-family:system-ui,sans-serif;pointer-events:none}
.flow{stroke-dasharray:8 6;animation:fl 1s linear infinite}@keyframes fl{to{stroke-dashoffset:-14}}
.pulse{animation:pu 1.6s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}
.menu{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.menu button{font-size:13px}.big{background:linear-gradient(90deg,#0b3a5c,#0b5c4a);border-color:var(--cy);font-weight:700;letter-spacing:.05em}
input{background:#0b1a33;color:var(--tx);border:1px solid #1e3a66;border-radius:6px;padding:6px;width:80px;font:inherit}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}.res div{background:#0b1a33;border:1px solid #1e3a66;border-radius:8px;padding:8px}.res b{display:block;color:var(--gr);font-size:20px}
.dot{fill:var(--cy)}
#cyc{position:fixed;inset:0;background:radial-gradient(circle at 50% 20%,#0e2040,#030610);z-index:9;display:none;flex-direction:column;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));overflow:auto}
#cyc.on{display:flex}.ph{display:flex;gap:14px;justify-content:center;margin:6px 0}
.ph button{width:96px;height:96px;border-radius:50%;font-size:28px;font-weight:800;border-width:3px}
@media(max-width:800px){main{flex-direction:column}#panel{width:100%;border-left:0;border-top:1px solid #15294a;max-height:42%}.ph button{width:70px;height:70px;font-size:20px}}
</style></head><body>
<header><h1>SYSTÈME EMBARQUÉ</h1><div id="bc"></div><button onclick="back()">← Retour</button><button onclick="zm(.15)">＋</button><button onclick="zm(-.15)">－</button><button onclick="zoom=1;ap()">Reset</button></header>
<main><div id="stage"><div id="view"></div></div><aside id="panel"></aside></main>
<div id="cyc"><div style="display:flex;justify-content:space-between;align-items:center"><b style="color:var(--cy);letter-spacing:.1em">CYCLE D’EXÉCUTION D’UNE INSTRUCTION — ADD A, B</b><button onclick="cyc.classList.remove('on')">✕ Fermer</button></div>
<div class="ph"><button style="color:#60a5fa;border-color:#3b82f6" onclick="phase(1)">01</button><button style="color:var(--or);border-color:var(--or)" onclick="phase(2)">02</button><button style="color:var(--gr);border-color:var(--gr)" onclick="phase(3)">03</button></div>
<div style="text-align:center;font-size:12px;color:var(--mu)">01 RECHERCHE (FETCH) · 02 DÉCODAGE (DECODE) · 03 EXÉCUTION (EXECUTE)</div>
<svg id="csv" viewBox="0 0 760 330" style="width:100%;max-width:900px;margin:6px auto"></svg><div id="ctx" style="max-width:900px;margin:0 auto;background:#07101f;border:1px solid #1e3a66;border-radius:10px;padding:12px"></div></div>
<script>
const $=s=>document.querySelector(s),view=$('#view'),panel=$('#panel');let zoom=1,stack=[],cur='home';
const N={home:'Système embarqué',mcu:'Microcontrôleur',cpu:'CPU / Processeur',ram:'Mémoire volatile — RAM',rom:'Mémoire non volatile',cap:'Organisation & capacité',bus:'Bus de communication',prog:'Types de programmation',sensor:'Capteur',act:'Actionneur'};
// ---- Contenu : FR = cours (PDF) ; "Ajout" = clarification hors cours
const D={
sensor:['Capteur','Composant d’entrée du système embarqué : il transmet l’information vers le microcontrôleur.','Ajout (hors PDF) : الكابتور يقيس حاجة من الخارج (حرارة، ضوء…) ويبعثها للميكروكونترولور.'],
act:['Actionneur','Composant de sortie : il agit selon l’ordre du microcontrôleur.','Ajout (hors PDF) : الأكسيونور يعمل الحركة اللي يطلبها منو الميكروكونترولور (موتور، LED…).'],
cpu:['CPU / Microprocesseur','CPU est le cerveau d’un calculateur qui traite et exécute les tâches, gère les autres blocs de composants. Il comprend : l’Unité de commande et contrôle et l’Unité de traitement.','الـCPU هو العقل متاع الكمبيوتر: يعمل الحساب وينفّذ المهام ويسيّر بقية الأجزاء.'],
uc:['Unité de commande et contrôle','Contient : Horloge, PC, Registre d’instruction, Décodeur d’instruction, Bloc logique de commande.','وحدة التحكم: تنظّم كل شي وتمشي على إيقاع الـhorloge.'],
ut:['Unité de traitement','Contient : l’Unité arithmétique et logique (UAL), le registre Accumulateur, le Registre d’état.','وحدة المعالجة: فيها الحساب والنتيجة والحالة.'],
hor:['Horloge','Élément de l’unité de commande : le bloc logique de commande organise l’exécution au rythme de l’horloge.','الـhorloge تعطي الإيقاع اللي يمشي عليه المعالج.'],
pc:['PC — Program Counter (Compteur ordinal)','Contient l’adresse de la prochaine instruction à traiter.','الـPC يحفظ عنوان التعليمة الجاية.'],
ri:['RI — Registre d’instruction','Contient l’instruction en cours d’exécution.','الـRI يحفظ التعليمة اللي توّا تتنفّذ.'],
dec:['Décodeur d’instruction','Le mot binaire (instruction) est décodé pour savoir quelle action correspond à l’instruction.','يفهم التعليمة الثنائية: شنوّا العملية المطلوبة.'],
blc:['Bloc logique de commande','Organise l’exécution des instructions au rythme de l’horloge.','ينظّم تنفيذ التعليمات حسب الـhorloge.'],
ual:['UAL — Unité arithmétique et logique','Unité de traitement qui exécute l’instruction ; le résultat est stocké dans l’accumulateur.','تعمل العمليات الحسابية والمنطقية (+، −، AND…).'],
acc:['Accumulateur','Registre de l’unité de traitement où est stocké le résultat de l’UAL.','يخزّن نتيجة العملية.'],
re:['Registre d’état','Représente la nature d’opération ; les drapeaux (chapots) y sont positionnés après l’exécution.','يعطي حالة العملية (مثلا النتيجة صفر ولا لا).'],
ramC:['RAM — Random Access Memory','Mémoire volatile. Deux familles : DRAM (dynamic) et SRAM (static).','ذاكرة تتمسح كي ينطفي الكورون (volatile).'],
romC:['ROM — Read Only Memory','Mémoire non volatile : types MROM, EEPROM, Flash NAND, Flash NOR.','ذاكرة للقراءة، تبقى كي ينطفي الكورون.'],
flash:['Mémoire Flash','Mémoire non volatile effaçable et reprogrammable après fabrication : Flash NAND et Flash NOR.','تتمسح وتتعاود تبرمج بعد التصنيع.'],
dram:['DRAM (dynamic)','Famille de RAM : ADRAM (Asynchrone) et SDRAM (Synchrone). Évolution : SDRAM, DDRAM, QDRAM.','RAM ديناميكية.'],
adram:['ADRAM (Asynchrone)','Variante de la DRAM : asynchrone.','DRAM غير متزامنة.'],
sdram:['SDRAM (Synchrone)','Variante de DRAM. Évolution mémoire : 1 seul accès mémoire — lecture ou écriture.','مرة وحدة: قراءة ولا كتابة.'],
ddram:['DDRAM','Évolution mémoire : 2 accès mémoire — lecture ou écriture.','زوز accès في نفس الوقت.'],
qdram:['QDRAM','Évolution mémoire : 4 accès mémoire — lecture et écriture.','أربعة accès.'],
sram:['SRAM (static)','Famille de RAM : SSRAM et ASRAM.','RAM ستاتيك.'],
ssram:['SSRAM','Variante de SRAM (synchrone).','SRAM متزامنة (ajout : le sens exact de “S” n’est pas écrit explicitement).'],
asram:['ASRAM','Variante de SRAM (asynchrone).','SRAM غير متزامنة (ajout : le sens exact de “A” n’est pas écrit explicitement).'],
rom:['ROM','Read Only Memory : mémoire non volatile.','ذاكرة للقراءة فقط.'],
mrom:['MROM (Mask)','Le contenu de la mémoire est masqué lors de la fabrication.','المحتوى يتحط وقت التصنيع وما يتبدّلش.'],
eprom:['EPROM','Cité dans le plan de votre demande ; non lisible dans le PDF (le PDF note EEPROM). À vérifier avec le cours.','Ajout : ذاكرة تتمسح وتتبرمج من جديد.'],
eeprom:['EEPROM','Peut être effacée dans son contenu et peut être reprogrammée après la fabrication.','تتمسح وتتبرمج بعد التصنيع.'],
fnand:['Flash NAND','Type de mémoire flash (effaçable, reprogrammable après fabrication).','نوع Flash.'],
fnor:['Flash NOR','Type de mémoire flash (effaçable, reprogrammable après fabrication).','نوع Flash.'],
vol:['Volatile vs Non volatile','Volatile : RAM (DRAM, SRAM). Non volatile : ROM (MROM, EEPROM, Flash). Ajout : une mémoire volatile perd son contenu sans alimentation.','Volatile تتمسح ; non volatile تبقى.'],
bad:['Bus d’adresse','① Bus d’adresse : le CPU y place l’adresse de la case mémoire à lire ou écrire.','الـCPU يبعث عنوان الكاز.'],
bdo:['Bus de données','③ Bus de donnée : transporte les données (bidirectionnel).','يعدّي فيه المحتوى (من وإلى).'],
bco:['Bus de contrôle','② Bus de contrôle : transporte les signaux de contrôle (CS, R/W).','يعدّي فيه الإشارات CS و R/W.'],
cs:['CS̄ (Chip Select)','CS = 0 → la mémoire accepte l’ordre de travailler (convention du cours).','CS=0 يعني الذاكرة مستعدة تخدم.'],
rw:['R/W̄','Si R/W̄ = 0 : opération de lecture, sinon écriture (R/W = 1).','0 = قراءة ، 1 = كتابة.'],
log:['Programmation logicielle','Premier type de programmation du cours. Ajout : écrire un programme (instructions) exécuté par le processeur.','تكتب كود (software).'],
mat:['Programmation matérielle','Type de programmation du cours. Ajout : décrire/configurer le circuit lui-même.','تبرمج الدارة نفسها (hardware).'],
gra:['Programmation graphique','Type de programmation du cours. Ajout : on assemble des blocs visuels au lieu d’écrire du texte.','برمجة بالبلوكات والرسوم.']
};
function info(k){const d=D[k];if(!d)return;panel.innerHTML=`<h2>${d[0]}</h2><div class=tag>Définition / fonction — FR (cours)</div><p>${d[1]}</p><div class=tag>Tunisien — explication simplifiée</div><div class=tn>${d[2]}</div>`;document.querySelectorAll('.hs').forEach(e=>e.classList.toggle('sel',e.dataset.k==k))}
function hs(k,x,y,w,h,label,fill,go,extra=''){return `<g class="hs" data-k="${k}" onclick="${go?`go('${go}')`:`info('${k}')`}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="8" fill="url(#${fill||'gm'})" stroke="#67e8f9" stroke-width="1.5"/>${extra}<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" fill="#e6f6ff" font-size="12" font-weight="700">${label}</text></g>`}
const defs=`<defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d4e89"/><stop offset="1" stop-color="#0a1f3d"/></linearGradient><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#052e2b"/></linearGradient><linearGradient id="go" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5410"/><stop offset="1" stop-color="#2d1805"/></linearGradient><linearGradient id="gk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#333b48"/><stop offset="1" stop-color="#0d1118"/></linearGradient><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#22d3ee"/></marker><filter id="sh"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity=".7"/></filter></defs>`;
const pins=(x,y,w,h)=>{let s='';for(let i=0;i<10;i++){s+=`<rect x="${x+8+i*(w-16)/10}" y="${y-8}" width="5" height="8" fill="#c9d1da"/><rect x="${x+8+i*(w-16)/10}" y="${y+h}" width="5" height="8" fill="#c9d1da"/>`}for(let i=0;i<7;i++){s+=`<rect x="${x-8}" y="${y+8+i*(h-16)/7}" width="8" height="5" fill="#c9d1da"/><rect x="${x+w}" y="${y+8+i*(h-16)/7}" width="8" height="5" fill="#c9d1da"/>`}return s};
const menu=`<div class=menu><button onclick="go('mcu')">Microcontrôleur</button><button onclick="go('ram')">Mémoire volatile</button><button onclick="go('rom')">Non volatile</button><button onclick="go('cap')">Capacité</button><button onclick="go('bus')">Bus</button><button onclick="go('prog')">Programmation</button><button class=big onclick="openCyc()">CYCLE D’EXÉCUTION D’UNE INSTRUCTION</button></div>`;
const S={
home:()=>`<svg viewBox="0 0 760 340">${defs}<rect width="760" height="340" rx="14" fill="#08121f" opacity=".6"/><g filter="url(#sh)"><g class="hs" data-k="sensor" onclick="go('sensor')"><rect x="40" y="110" width="150" height="110" rx="12" fill="url(#gg)" stroke="#34d399" stroke-width="2"/><circle cx="115" cy="150" r="22" fill="#021a17" stroke="#34d399"/><circle cx="115" cy="150" r="9" fill="#34d399" class="pulse"/><rect x="100" y="180" width="30" height="30" fill="#c9d1da"/><text x="115" y="232" text-anchor="middle" fill="#bff" font-size="13" font-weight="700">CAPTEUR</text></g>
<g class="hs" data-k="mcu" onclick="go('mcu')"><rect x="290" y="95" width="180" height="140" rx="10" fill="url(#gk)" stroke="#67e8f9" stroke-width="2"/>${pins(290,95,180,140)}<circle cx="308" cy="113" r="5" fill="#777"/><text x="380" y="160" text-anchor="middle" fill="#9fe" font-size="12" font-weight="700">MCU</text><text x="380" y="180" text-anchor="middle" fill="#7f93ad" font-size="10">CPU · RAM · ROM · FLASH</text><text x="380" y="262" text-anchor="middle" fill="#bff" font-size="13" font-weight="700">MICROCONTRÔLEUR</text></g>
<g class="hs" data-k="act" onclick="go('act')"><rect x="570" y="110" width="150" height="110" rx="12" fill="url(#go)" stroke="#fb923c" stroke-width="2"/><circle cx="645" cy="160" r="30" fill="#1a0c02" stroke="#fb923c"/><g class="pulse"><rect x="640" y="132" width="10" height="56" fill="#fb923c"/><rect x="617" y="155" width="56" height="10" fill="#fb923c"/></g><text x="645" y="242" text-anchor="middle" fill="#fdd" font-size="13" font-weight="700">ACTIONNEUR</text></g></g>
<line class="flow" x1="195" y1="165" x2="285" y2="165" stroke="#22d3ee" stroke-width="3" marker-end="url(#ar)"/><line class="flow" x1="475" y1="165" x2="565" y2="165" stroke="#22d3ee" stroke-width="3" marker-end="url(#ar)"/><text x="380" y="40" text-anchor="middle" fill="#7f93ad" font-size="13">CAPTEUR → MICROCONTRÔLEUR → ACTIONNEUR — cliquez sur un composant</text></svg>${menu}`,
mcu:()=>`<svg viewBox="0 0 760 360">${defs}<rect x="130" y="30" width="500" height="300" rx="14" fill="url(#gk)" stroke="#67e8f9" stroke-width="2" filter="url(#sh)"/>${pins(130,30,500,300)}<rect x="160" y="55" width="440" height="250" rx="8" fill="#06101c" stroke="#1e3a66" stroke-dasharray="4"/><text x="380" y="48" text-anchor="middle" fill="#7f93ad" font-size="10">VUE EN COUPE — DIE INTERNE</text>${hs('cpu',180,75,200,210,'CPU / Processeur','gm','cpu')}${hs('ramC',400,75,180,60,'Mémoire RAM','gg','ram')}${hs('romC',400,150,180,60,'Mémoire ROM','go','rom')}${hs('flash',400,225,180,60,'Mémoire Flash','go','rom')}</svg>${menu}`,
cpu:()=>`<svg viewBox="0 0 760 400">${defs}<rect x="30" y="10" width="700" height="380" rx="14" fill="#08121f" stroke="#1e3a66"/><rect x="50" y="40" width="440" height="330" rx="10" fill="#0a1d36" stroke="#3b82f6" class="hs" data-k="uc" onclick="info('uc')"/><text x="60" y="58" fill="#60a5fa" font-size="12" font-weight="700">UNITÉ DE COMMANDE ET CONTRÔLE</text><rect x="510" y="40" width="200" height="330" rx="10" fill="#0a2a22" stroke="#34d399" class="hs" data-k="ut" onclick="info('ut')"/><text x="520" y="58" fill="#34d399" font-size="12" font-weight="700">UNITÉ DE TRAITEMENT</text>${hs('hor',70,80,130,50,'Horloge','gm')}${hs('pc',230,80,130,50,'PC','gm')}${hs('ri',230,150,130,50,'RI','gm')}${hs('dec',70,150,130,50,'Décodeur','gm')}${hs('blc',70,230,290,60,'Bloc logique de commande','gm')}${hs('ual',530,80,160,100,'UAL','gg')}${hs('acc',530,200,160,50,'Accumulateur','gg')}${hs('re',530,270,160,50,'Registre d’état','gg')}<path class="flow" d="M360 105H420V260H360M360 175H400M200 175H230M200 105H230M290 130V150M290 200V230M360 260H520M600 180V200M600 250V270" fill="none" stroke="#22d3ee" stroke-width="2"/><text x="380" y="385" text-anchor="middle" fill="#7f93ad" font-size="10">PC → bus d’adresse · RI ← bus de données (cf. cours)</text></svg><div class=menu><button onclick="openCyc()" class=big>CYCLE D’EXÉCUTION</button></div>`,
ram:()=>memScene('RAM','vol',[['dram','DRAM (dynamic)',130,112,150],['sram','SRAM (static)',480,112,150],['adram','ADRAM',70,180,130,205],['sdram','SDRAM',220,180,130,205],['ssram','SSRAM',420,180,120,555],['asram','ASRAM',560,180,120,555]],`<text x="380" y="252" text-anchor="middle" fill="#7f93ad" font-size="12">Évolution mémoire — DRAM :</text>`+[['sdram','SDRAM','1 accès'],['ddram','DDRAM','2 accès'],['qdram','QDRAM','4 accès']].map((e,i)=>hs(e[0],70+i*220,262,200,46,e[1]+' — '+e[2],'gg')).join('')),
rom:()=>memScene('ROM','vol',[['rom','ROM',305,112,150],['mrom','MROM (Mask)',15,180,130,380],['eprom','EPROM*',160,180,130,380],['eeprom','EEPROM',305,180,130,380],['fnand','Flash NAND',450,180,130,380],['fnor','Flash NOR',595,180,130,380]],`<text x="380" y="260" text-anchor="middle" fill="#7f93ad" font-size="11">* EPROM : demandé par le plan, non lisible dans le PDF</text>`),
cap:()=>{return `<svg viewBox="0 0 760 250">${defs}<text x="10" y="18" fill="#7f93ad" font-size="12">CPU → bus d’adresse → Décodeur (n entrées, 2ⁿ sorties) → cases mémoire (registres de bascules)</text><rect x="20" y="50" width="120" height="120" rx="8" fill="url(#gm)" stroke="#22d3ee"/><text x="80" y="115" text-anchor="middle" fill="#fff" font-weight="700">CPU</text>${[0,1,2,3].map(i=>`<line class=flow x1="140" y1="${70+i*30}" x2="250" y2="${70+i*30}" stroke="#22d3ee"/><text x="150" y="${66+i*30}" fill="#7f93ad" font-size="10">A${i}</text>`).join('')}<path d="M250 50L330 70V150L250 170z" fill="url(#go)" stroke="#fb923c"/><text x="290" y="115" text-anchor="middle" fill="#fff" font-size="11">Décodeur</text><g id=cells></g></svg><div class=res><div>Case mémoire = registre de bascules (stocke les bits)<b>Mot mémoire</b></div><div>1 octet<b>= 8 bits</b></div></div>
<p>N = 2<sup>n</sup> (nombre de cases) · C = N × T (capacité) <span style="color:var(--mu)">(cours : C = nombre de cases mémoire × taille de donnée = 2^nb bits d’adresse × nombre de données)</span></p>
n (bits d’adresse) <input id=n type=number min=1 max=32 value=4 oninput=calc()> &nbsp; T (bits par case) <input id=t type=number min=1 value=8 oninput=calc()>
<div class=res><div>N cases<b id=rN></b></div><div>Capacité (bits)<b id=rB></b></div><div>Capacité (octets)<b id=rO></b></div></div><div class=tag>Exemple du cours : 4 bits d’adresse, 8 bits/case → 16 cases, 128 bits, 16 octets.</div>
<div class=tag style="margin-top:12px">Unités</div><div class=res><div>Octet<b>8 bits</b></div><div>Ko<b>1024 octets = 2¹⁰</b></div><div>Mo<b>1024 Ko = 2²⁰</b></div><div>Go<b>1024 Mo = 2³⁰</b></div><div>To<b>1024 Go = 2⁴⁰</b></div></div>`},
bus:()=>`<svg viewBox="0 0 760 300">${defs}<rect x="30" y="80" width="150" height="140" rx="10" fill="url(#gm)" stroke="#22d3ee"/><text x="105" y="155" text-anchor="middle" fill="#fff" font-weight="700">CPU</text><rect x="580" y="80" width="150" height="140" rx="10" fill="url(#gg)" stroke="#34d399"/><text x="655" y="155" text-anchor="middle" fill="#fff" font-weight="700">RAM</text>
<g class="hs" data-k="bad" onclick="info('bad')"><line x1="180" y1="105" x2="580" y2="105" stroke="#60a5fa" stroke-width="6"/><text x="380" y="97" text-anchor="middle" fill="#60a5fa" font-size="12">① Bus d’adresse</text></g><g class="hs" data-k="bco" onclick="info('bco')"><line x1="180" y1="150" x2="580" y2="150" stroke="#fb923c" stroke-width="6"/><text x="380" y="142" text-anchor="middle" fill="#fb923c" font-size="12">② Bus de contrôle</text></g><g class="hs" data-k="bdo" onclick="info('bdo')"><line x1="180" y1="195" x2="580" y2="195" stroke="#34d399" stroke-width="6"/><text x="380" y="187" text-anchor="middle" fill="#34d399" font-size="12">③ Bus de données</text></g>
<g class="hs" data-k="cs" onclick="info('cs')"><line x1="630" y1="80" x2="630" y2="30" stroke="#e879f9" stroke-width="3"/><text x="630" y="22" text-anchor="middle" fill="#e879f9" font-weight="700">CS̄</text></g><g class="hs" data-k="rw" onclick="info('rw')"><line x1="690" y1="80" x2="690" y2="30" stroke="#e879f9" stroke-width="3"/><text x="690" y="22" text-anchor="middle" fill="#e879f9" font-weight="700">R/W̄</text></g>
<circle id=d1 class=dot r=7 cx=180 cy=105 opacity=0 fill="#60a5fa"/><circle id=d2 class=dot r=7 cx=180 cy=150 opacity=0 fill="#fb923c"/><circle id=d3 class=dot r=7 cx=580 cy=195 opacity=0 fill="#34d399"/></svg><div class=menu><button class=big onclick="readAnim()">▶ Animer une LECTURE (CPU ← RAM)</button></div><div id=bst style="text-align:center;color:var(--cy)">CS = 0 : mémoire sélectionnée · R/W = 0 : lecture · R/W = 1 : écriture</div>`,
prog:()=>`<div class=menu style="margin-top:30px">${[['log','Logicielle'],['mat','Matérielle'],['gra','Graphique']].map(a=>`<button class=big onclick="info('${a[0]}');pv('${a[0]}')">Programmation ${a[1]}</button>`).join('')}</div><div id=pv style="max-width:600px;margin:auto"></div>`
};
function memScene(t,_,nodes,extra){return `<svg viewBox="0 0 760 330">${defs}<rect x="260" y="20" width="240" height="70" rx="8" fill="url(#gk)" stroke="#67e8f9" filter="url(#sh)"/>${pins(260,20,240,70)}<text x="380" y="60" text-anchor="middle" fill="#9fe" font-weight="700">${t}</text><text x="20" y="50" fill="#7f93ad" font-size="11" class="hs" onclick="info('vol')" style="cursor:pointer;fill:#22d3ee;text-decoration:underline">Volatile vs non volatile ›</text>${nodes.map(n=>n[5]?`<path d="M${n[2]+n[4]/2} 180V166H${n[5]}V152" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".6"/>`:`<path d="M380 98V105H${n[2]+n[4]/2}V112" fill="none" stroke="#22d3ee" stroke-width="1.5" opacity=".6"/>`).join('')}${nodes.map(n=>hs(n[0],n[2],n[3],n[4],40,n[1],t=='RAM'?'gg':'go')).join('')}${extra}</svg><div class=menu><button onclick="go('${t=='RAM'?'rom':'ram'}')">${t=='RAM'?'→ Non volatile':'→ Volatile (RAM)'}</button></div>`}
function pv(k){const t={log:'Exemple (ajout) : un programme écrit en langage texte (instructions) → mémoire → exécuté par le CPU.',mat:'Exemple (ajout) : configuration/description du circuit lui-même (câblage logique).',gra:'Exemple (ajout) : blocs graphiques reliés entre eux qui génèrent le programme.'};const c={log:'#60a5fa',mat:'#fb923c',gra:'#34d399'}[k];$('#pv').innerHTML=`<svg viewBox="0 0 400 120"><rect x="10" y="10" width="380" height="100" rx="10" fill="#0a1d36" stroke="${c}"/>${k=='log'?'<text x="30" y="50" fill="'+c+'" font-family="monospace">ADD A, B</text><text x="30" y="75" fill="'+c+'" font-family="monospace">MOV R1, A</text>':k=='mat'?'<circle cx="80" cy="60" r="26" fill="none" stroke="'+c+'"/><path d="M106 60H200M200 45V75L240 60z" stroke="'+c+'" fill="none"/>':'<rect x="40" y="40" width="80" height="40" fill="none" stroke="'+c+'"/><rect x="220" y="40" width="80" height="40" fill="none" stroke="'+c+'"/><path class=flow d="M120 60H220" stroke="'+c+'" fill="none"/>'}</svg><p>${t[k]}</p>`}
function calc(){const n=+$('#n').value||0,t=+$('#t').value||0,N=2**n,B=N*t;$('#rN').textContent=N.toLocaleString('fr');$('#rB').textContent=B.toLocaleString('fr');$('#rO').textContent=(B/8).toLocaleString('fr');const g=$('#cells');let s='';const m=Math.min(N,8);for(let i=0;i<m;i++)s+=`<rect x="380" y="${24+i*26}" width="260" height="22" fill="#0b1a33" stroke="#34d399"/><text x="390" y="${40+i*26}" fill="#7f93ad" font-size="10">@${i.toString(2).padStart(n,'0').slice(-8)}</text><text x="470" y="${40+i*26}" fill="#34d399" font-size="11" font-family="monospace">${'0'.repeat(Math.min(t,24))}</text>`;g.innerHTML=s+`<text x="650" y="40" fill="#7f93ad" font-size="10">… ${N} cases</text>`}
function readAnim(){const d=[$('#d1'),$('#d2'),$('#d3')],bs=$('#bst');const mv=(e,x1,x2,dur)=>{e.setAttribute('opacity',1);e.animate([{transform:`translateX(0)`},{transform:`translateX(${x2-x1}px)`}],{duration:dur,fill:'forwards'}).onfinish=()=>e.setAttribute('opacity',0)};
bs.textContent='① CPU place l’adresse sur le bus d’adresse';mv(d[0],180,580,1400);setTimeout(()=>{bs.textContent='② CS = 0 (mémoire sélectionnée) et R/W = 0 (lecture) sur le bus de contrôle';mv(d[1],180,580,1400)},1500);setTimeout(()=>{bs.textContent='③ Le contenu de la case revient sur le bus de données → CPU';d[2].setAttribute('opacity',1);d[2].animate([{transform:'translateX(0)'},{transform:'translateX(-400px)'}],{duration:1400,fill:'forwards'}).onfinish=()=>d[2].setAttribute('opacity',0)},3000)}
// ---- navigation
function render(k){view.classList.add('out');setTimeout(()=>{view.innerHTML=(S[k]||(()=>S.home()))();ap();view.classList.remove('out');if(k=='cap')calc();if(D[k])info(k);else if(k=='home')panel.innerHTML='<h2>Bienvenue</h2><p>Explorez comme une application d’anatomie : cliquez sur un composant pour entrer à l’intérieur. Source : votre cours (PDF). Les textes marqués “Ajout” sont des clarifications hors cours.</p><div class=tn>اضغط على أي مكوّن باش تدخل لداخلو.</div>';crumb()},350)}
function go(k){if(['sensor','act'].includes(k)){info(k);return}stack.push(cur);cur=k;render(k)}
function back(){if(stack.length){cur=stack.pop();render(cur)}}
function jump(i){while(stack.length>i)cur=stack.pop();render(cur)}
function crumb(){const p=[...stack,cur];$('#bc').innerHTML=p.map((k,i)=>i<p.length-1?`<a onclick="jump(${i})">${N[k]||k}</a>`:`<b>${N[k]||k}</b>`).join(' › ')}
function zm(d){zoom=Math.max(.6,Math.min(2.2,zoom+d));ap()}function ap(){view.style.transform=`scale(${zoom})`}
// ---- cycle
const cyc=$('#cyc'),CS=$('#csv');
const bx=(id,x,y,w,h,l,c)=>`<g id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="7" fill="#0a1d36" stroke="${c||'#3b82f6'}" stroke-width="2"/><text x="${x+w/2}" y="${y+h/2-2}" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">${l}</text><text id="v${id}" x="${x+w/2}" y="${y+h/2+14}" text-anchor="middle" fill="#fcd34d" font-size="11"></text></g>`;
function openCyc(){cyc.classList.add('on');CS.innerHTML=`<defs><marker id="a2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0L8,4L0,8z" fill="#22d3ee"/></marker></defs><rect x="5" y="5" width="470" height="320" rx="10" fill="none" stroke="#1e3a66"/><text x="15" y="22" fill="#7f93ad" font-size="10">MICROPROCESSEUR</text>${bx('PC',20,40,100,50,'PC')}${bx('RI',140,40,100,50,'RI')}${bx('DEC',20,110,130,50,'Décodeur')}${bx('BLC',170,110,140,50,'Bloc logique cmd')}${bx('UAL',20,190,130,60,'UAL','#34d399')}${bx('ACC',170,190,120,50,'Accumulateur','#34d399')}${bx('RE',300,190,110,50,'Reg. d’état','#34d399')}${bx('M',560,20,190,290,'MÉMOIRE')}<g stroke="#22d3ee" stroke-width="2" fill="none" marker-end="url(#a2)"><path d="M480 55H550"/><path d="M480 150H550"/><path d="M550 250H480"/></g><text x="515" y="48" fill="#60a5fa" font-size="9" text-anchor="middle">bus adr.</text><text x="515" y="143" fill="#fb923c" font-size="9" text-anchor="middle">bus ctrl</text><text x="515" y="243" fill="#34d399" font-size="9" text-anchor="middle">bus données</text><text x="655" y="80" fill="#fcd34d" font-size="11" text-anchor="middle" id="mc">@0 : ADD A,B (opcode)</text><circle id="pk" r="9" fill="#22d3ee" cx="500" cy="55" opacity="0"/>`;phase(0)}
const hl=(ids,c)=>{CS.querySelectorAll('g[id]').forEach(g=>g.querySelector('rect').style.filter='');ids.forEach(i=>{const g=CS.querySelector('#'+i);if(g)g.querySelector('rect').style.filter=`drop-shadow(0 0 10px ${c})`})};
const sv=(i,t)=>{const e=CS.querySelector('#v'+i);if(e)e.textContent=t};const wait=ms=>new Promise(r=>setTimeout(r,ms));let tok=0;
const TXT={0:'Cliquez sur 01, 02 ou 03. Exemple : ADD A, B (hypothèse pédagogique : A = 5, B = 3 → résultat 8, ajout hors cours).',
1:['PHASE 1 — RECHERCHE de l’instruction à traiter',['Le compteur PC contient l’adresse d’instruction à traiter.','L’unité de commande donne l’ordre de lecture ; cette adresse est placée sur le bus d’adresse.','Le contenu de la case mémoire sélectionnée est disponible sur le bus de données.','L’instruction se stocke dans le registre RI.']],
2:['PHASE 2 — DÉCODAGE de l’instruction et recherche de l’opérande',['L’instruction est décodée sur plusieurs mots ; le premier mot représente le code opération (Opcode) qui définit la nature de l’instruction.','L’unité de commande transfère l’instruction vers l’unité de traitement.','Si l’instruction nécessite une donnée (opérande) de la mémoire, l’unité de contrôle envoie l’adresse de l’opérande sur le bus d’adresse puis récupère la donnée sur le bus de données.','Les opérandes sont stockés dans le registre RI (selon le cours).']],
3:['PHASE 3 — EXÉCUTION de l’instruction',['L’instruction sera exécutée par l’UAL et le résultat est stocké dans l’accumulateur.','Les drapeaux (chapots) sont positionnés dans le registre d’état.','L’unité de commande positionne le PC sur l’instruction suivante.']]};
function say(p,i){const t=TXT[p];$('#ctx').innerHTML=`<b style="color:${['','#60a5fa','#fb923c','#34d399'][p]}">${t[0]}</b><ol>${t[1].map((s,j)=>`<li style="opacity:${j<=i?1:.35}">${s}</li>`).join('')}</ol>`}
async function phase(p){const my=++tok;if(!p){$('#ctx').textContent=TXT[0];sv('PC','@0');return}const st=async(i,ids,c,fn)=>{if(my!=tok)throw 0;say(p,i);hl(ids,c);fn&&fn();await wait(1800)};const pk=CS.querySelector('#pk');
try{if(p==1){await st(0,['PC'],'#60a5fa',()=>sv('PC','@0'));await st(1,['PC','BLC','M'],'#60a5fa',()=>{pk.setAttribute('opacity',1);pk.setAttribute('cy',55)});await st(2,['M'],'#60a5fa',()=>pk.setAttribute('cy',250));await st(3,['RI'],'#60a5fa',()=>{pk.setAttribute('opacity',0);sv('RI','ADD A,B')})}
if(p==2){await st(0,['RI','DEC'],'#fb923c',()=>sv('DEC','Opcode=ADD'));await st(1,['DEC','UAL'],'#fb923c');await st(2,['M','BLC'],'#fb923c');await st(3,['RI'],'#fb923c',()=>sv('RI','A=5, B=3'))}
if(p==3){await st(0,['UAL','ACC'],'#34d399',()=>{sv('UAL','5+3');sv('ACC','8')});await st(1,['RE'],'#34d399',()=>sv('RE','Z=0'));await st(2,['PC'],'#34d399',()=>sv('PC','@1'))}}catch(e){}}
go.noop=0;render('home');
</script></body></html>
